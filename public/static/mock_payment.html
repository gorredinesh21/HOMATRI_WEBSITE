<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homatri Payment Gateway Simulator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #FBF9F6; font-family: sans-serif; }
  </style>
</head>
<div class="min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-3xl p-6 shadow-xl border border-slate-200 text-center">
    
    <div class="w-16 h-16 bg-orange-100 border border-orange-300 rounded-2xl flex items-center justify-center mx-auto mb-4 text-3xl">
      💳
    </div>

    <span class="bg-emerald-100 text-emerald-800 text-[10px] font-black px-2.5 py-1 rounded-full uppercase tracking-wider">
      Test Payment Mode
    </span>

    <h1 class="text-2xl font-bold text-slate-900 mt-2">Homatri Razorpay Simulator</h1>
    <p class="text-xs text-slate-500 mt-1">Simulating live UPI / Card payment verification.</p>

    <div class="bg-slate-50 border border-slate-200 rounded-2xl p-4 my-6 text-left space-y-2">
      <div class="flex justify-between text-xs text-slate-600">
        <span>Order ID:</span>
        <span id="orderIdDisplay" class="font-bold text-slate-900">ORD-123456</span>
      </div>
      <div class="flex justify-between text-xs text-slate-600">
        <span>Amount Payable:</span>
        <span id="amountDisplay" class="font-bold text-emerald-600">₹179.00</span>
      </div>
      <div class="flex justify-between text-xs text-slate-600">
        <span>Merchant:</span>
        <span class="font-semibold text-slate-800">Homatri Kitchens Ltd</span>
      </div>
    </div>

    <div class="space-y-3">
      <button
        onclick="completePayment('SUCCESS')"
        class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl text-sm shadow-md transition-all flex items-center justify-center gap-2"
      >
        <span>✅ Simulate Successful Payment</span>
      </button>

      <button
        onclick="completePayment('CANCEL')"
        class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3 rounded-xl text-xs transition-colors"
      >
        <span>❌ Cancel Payment & Return</span>
      </button>
    </div>

  </div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const orderId = urlParams.get('order_id') || 'ORD-HOMATRI';
  const amount = urlParams.get('amount') || '179.0';

  document.getElementById('orderIdDisplay').innerText = orderId;
  document.getElementById('amountDisplay').innerText = `₹${parseFloat(amount).toFixed(2)}`;

  function completePayment(status) {
    if (status === 'SUCCESS') {
      alert('Payment Successful! Redirecting to Live Driver Tracking...');
      window.location.href = `/order/tracking?order_id=${encodeURIComponent(orderId)}`;
    } else {
      window.location.href = '/order';
    }
  }
</script>
</html>
